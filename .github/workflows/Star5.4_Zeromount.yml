name: Build Xiaomi11U Hyper A14 - ZeroMount (Final)

on:
  workflow_dispatch:

env:
  # Kernel Source (Formato CORRECTO para actions/checkout)
  KERNEL_SOURCE: "joel27/android_kernel_xiaomi_sm8350-miui"
  KERNEL_BRANCH: "hyper-14"

  # ----- TOOLCHAINS -----
  CLANG_SOURCE: "https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20241222-release/Clang-20.0.0git-20241222.tar.gz"
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "android12L-release"

  # ----- DEFCONFIG -----
  DEFCONFIG_NAME: "vendor/star_defconfig"

  # ----- REPOSITORIO DE PARCHES (Super-Builders) -----
  PATCHES_SOURCE: "joel27/Super-Builders"
  PATCHES_BRANCH: "main"

  # ----- KERNELSU (ReSukiSU) -----
  KERNELSU_AUTO_FORK: "resukisu"
  KERNELSU_METHOD: "shell"

  # ----- CARACTERÍSTICAS ACTIVADAS -----
  add_susfs: "true"
  add_zeromount: "true"
  add_zram: "true"

  # ----- EMPAQUETADO -----
  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"
  GENERATE_DTB: "true"
  ROM_TEXT: "ZeroMount-Final"

  # ----- OTRAS -----
  EXTRA_CMDS: 'LD=ld.lld LLVM=1 LLVM_IAS=1'
  PYTHON_VERSION: "3"

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout del kernel
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_SOURCE }}
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1
          submodules: true

      # 2. Instalar dependencias
      - name: Setup Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev make python3 cpio zip curl wget rsync

      # 3. Configurar Clang y GCC
      - name: Setup Toolchains
        run: |
          mkdir -p clang
          curl -L ${{ env.CLANG_SOURCE }} | tar -xz -C clang
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH
          git clone ${{ env.GCC_64_SOURCE }} -b ${{ env.GCC_64_BRANCH }} gcc64
          git clone ${{ env.GCC_32_SOURCE }} -b ${{ env.GCC_32_BRANCH }} gcc32

      # 4. Clonar Super-Builders (para obtener zeromount.c y otros archivos)
      - name: Clone Super-Builders
        run: git clone --depth 1 https://github.com/${{ env.PATCHES_SOURCE }} -b ${{ env.PATCHES_BRANCH }} super_builders

      # 5. Integrar ReSukiSU
      - name: Integrate ReSukiSU
        run: curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main

      # ⚠️ 6. ¡CRUCIAL! Aplicar fixes de compatibilidad para kernel 5.4
      - name: Apply Kernel 5.4 Compatibility Fixes
        run: |
          # Fix 1: pgtable.h
          grep -rl "linux/pgtable.h" drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i 's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|g' "$f"
          done
          # Fix 2: strncpy_from_user_nofault
          grep -rl "strncpy_from_user_nofault" drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i 's|strncpy_from_user_nofault|strncpy_from_user|g' "$f"
          done
          # Fix 3: copy_*_nofault
          grep -rl "copy_to_kernel_nofault" drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i 's|copy_to_kernel_nofault|probe_kernel_write|g' "$f"
          done
          grep -rl "copy_from_user_nofault" drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i 's|copy_from_user_nofault|probe_kernel_read|g' "$f"
          done
          # Fix 4: ¡CRUCIAL! Reemplazar seccomp_cache.c por un stub para evitar el error SECCOMP_ARCH_NATIVE_NR
          echo "⚙️ Replacing seccomp_cache.c with stub version for kernel 5.4 compatibility..."
          cat > drivers/kernelsu/infra/seccomp_cache.c << 'EOF'
          #include "seccomp_cache.h"
          void ksu_seccomp_allow_cache(struct seccomp_filter *filter, int nr) { }
          void ksu_seccomp_cache_init(void) { }
          EOF

      # 7. Añadir SuSFS
      - name: Add SuSFS
        if: env.add_susfs == 'true'
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4
          cp susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/
          echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile
          # Añadir header faltante
          grep -q "linux/cred.h" include/linux/susfs_def.h || sed -i '1i#include <linux/cred.h>' include/linux/susfs_def.h

      # 8. Añadir ZeroMount (buscando zeromount.c dentro de Super-Builders)
      - name: Add ZeroMount
        if: env.add_zeromount == 'true'
        run: |
          ZM_FILE=$(find super_builders -name "zeromount.c" | head -n 1)
          if [ -f "$ZM_FILE" ]; then
            cp "$ZM_FILE" drivers/zeromount.c
            echo 'obj-$(CONFIG_ZEROMOUNT) += zeromount.o' >> drivers/Makefile
            echo "CONFIG_ZEROMOUNT=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          else
            echo "::warning::zeromount.c not found in Super-Builders"
          fi

      # 9. Configurar el kernel
      - name: Configure Kernel
        run: |
          export ARCH=arm64
          make ARCH=arm64 ${{ env.DEFCONFIG_NAME }}
          # Forzar opciones de configuración
          echo "CONFIG_KSU=y" >> .config
          echo "CONFIG_KSU_SUSFS=y" >> .config
          if [ "${{ env.add_zram }}" = "true" ]; then
            echo "CONFIG_ZRAM=y" >> .config
          fi
          if [ "${{ env.add_zeromount }}" = "true" ]; then
            echo "CONFIG_ZEROMOUNT=y" >> .config
          fi

      # 10. Compilar el kernel
      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=$(pwd)/gcc64/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$(pwd)/gcc32/bin/arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make -j$(nproc) ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            CLANG_TRIPLE=$CLANG_TRIPLE

      # 11. Empaquetar con AnyKernel3
      - name: Package with AnyKernel3
        run: |
          git clone ${{ env.AK3_SOURCE }} -b ${{ env.AK3_BRANCH }} AnyKernel3
          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            cp arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f arch/arm64/boot/Image.gz ]; then
            cp arch/arm64/boot/Image.gz AnyKernel3/
          elif [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image AnyKernel3/
          fi
          if [ "${{ env.GENERATE_DTB }}" = "true" ] && [ -f arch/arm64/boot/dtbo.img ]; then
            cp arch/arm64/boot/dtbo.img AnyKernel3/
          fi
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          echo 'BLOCK=boot;' >> anykernel.sh
          echo 'IS_SLOT_DEVICE=1;' >> anykernel.sh
          echo 'device.name1=star;' >> anykernel.sh
          zip -r9 ../kernel-${{ env.ROM_TEXT }}-$(date +%Y%m%d-%H%M).zip . -x ".git*"
          cd ..

      # 12. Subir los artefactos
      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.ROM_TEXT }}
          path: "*.zip"
          retention-days: 7

      - name: Upload DTBO Artifact
        if: env.GENERATE_DTB == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dtbo.img
          path: arch/arm64/boot/dtbo.img
          retention-days: 7
